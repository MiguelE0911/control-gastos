[versions]
kotlin = "2.4.21"
sqldelight = "2.4.1"
coroutines = "1.11.0"
datetime = "0.8.0"
javafx = "21.0.12"
javafxPlugin = "0.1.0"
sqliteJdbc = "3.46.1.3"
jasperreports = "6.21.0"
openpdf = "1.3.30"
agp = "9.4.1"
androidCompileSdk = "36"
androidMinSdk = "24"

[libraries]
# Shared
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-sqlite-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
sqldelight-android-driver = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }

# Desktop / JVM
javafx-controls = { module = "org.openjfx:javafx-controls", version.ref = "javafx" }
javafx-fxml = { module = "org.openjfx:javafx-fxml", version.ref = "javafx" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqliteJdbc" }
jasperreports = { module = "net.sf.jasperreports:jasperreports", version.ref = "jasperreports" }
openpdf = { module = "com.github.librepdf:openpdf", version.ref = "openpdf" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
javafx = { id = "org.openjfx.javafxplugin", version.ref = "javafxPlugin" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
