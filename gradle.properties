# --- Gradle ---
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true

# --- Android (AGP) ---
android.useAndroidX=true
# La ruta del proyecto contiene un caracter no-ASCII ("Programacion" con tilde).
# AGP es conservador y bloquea el build en Windows; lo permitimos explicitamente.
android.overridePathCheck=true
